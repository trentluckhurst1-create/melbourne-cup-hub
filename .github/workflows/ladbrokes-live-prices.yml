name: Ladbrokes Live Prices

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'

permissions:
  contents: write

concurrency:
  group: ladbrokes-live-prices
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch Ladbrokes Melbourne Cup futures
        env:
          LADBROKES_FROM: ${{ secrets.LADBROKES_FROM }}
          LADBROKES_PARTNER: ${{ secrets.LADBROKES_PARTNER }}
          LADBROKES_PARTNER_ID: ${{ secrets.LADBROKES_PARTNER_ID }}
          LADBROKES_REPUBLICATION_APPROVED: ${{ secrets.LADBROKES_REPUBLICATION_APPROVED }}
        run: node scripts/fetch-ladbrokes-live.mjs

      - name: Commit changed price feed
        run: |
          if git diff --quiet -- data/markets/live-ladbrokes.json; then
            echo "No Ladbrokes price-feed change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/markets/live-ladbrokes.json
          git commit -m "Update Ladbrokes Melbourne Cup live prices"
          git push
