name: validate unique form
on:
  push:
    paths:
      - 'scripts/validate_unique_form.py'
      - '.github/workflows/validate-unique-form.yml'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/validate_unique_form.py
      - name: Commit strict canonical form and audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/form/2026-09-15-unique-full-form.json data/form/2026-09-15-unique-form-audit.json data/form/2026-09-15-unique-form-gaps.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Audit unique actual starts across all 101 nominees"
          git pull --rebase origin main
          git push origin main
