name: build complete form

on:
  push:
    branches: [main]
    paths:
      - 'scripts/augment_form_parallel.py'
      - 'scripts/apply_form_overrides.py'
      - 'data/form/2026-09-15-form-authoritative-overrides.json'
      - 'data/form/2026-09-15-form-canonical.json'
      - 'data/form/2026-09-15-form-coverage-ledger.json'
      - '.github/workflows/build-complete-form.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Apply authoritative verified form overrides
        run: python scripts/apply_form_overrides.py
      - name: Parallel identity-guarded form completion
        run: python scripts/augment_form_parallel.py
      - name: Re-apply authoritative overrides after automated pass
        run: python scripts/apply_form_overrides.py
      - name: Commit canonical form and audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/form/2026-09-15-form-canonical.json data/form/2026-09-15-form-coverage-ledger.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Advance canonical 101-horse form coverage"
          git push
