name: full form collector
on:
  push:
    paths:
      - '.github/workflows/full-form-collector.yml'
      - 'data/form/2026-09-15-form-final-overrides.json'
      - 'data/form/2026-09-15-form-pierre-fix.json'
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python scripts/collect_full_form.py
      - name: Commit form data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/form/2026-09-15-racehub-full-form.json data/form/2026-09-15-full-form.json data/form/2026-09-15-form-coverage-audit.json data/form/2026-09-15-form-gaps.json
          if git diff --cached --quiet; then
            echo "No form changes"
          else
            git commit -m "Refresh canonical full-field form coverage"
            git pull --rebase origin main
            git push origin main
          fi
# Pierre final audit trigger 6
