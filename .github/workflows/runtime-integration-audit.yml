name: runtime integration audit
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '*.js'
      - 'scripts/audit_runtime_integration.py'
      - 'data/form/2026-09-15-unique-full-form.json'
      - 'data/form/2026-09-15-unique-form-audit.json'
      - '.github/workflows/runtime-integration-audit.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python scripts/audit_runtime_integration.py
      - name: Commit integration audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/form/2026-09-15-runtime-integration-audit.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record runtime integration audit"
          git pull --rebase origin main
          git push origin main
