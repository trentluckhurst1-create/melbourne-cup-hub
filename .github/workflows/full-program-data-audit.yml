name: full program data audit
on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'scripts/audit_full_program_data.py'
      - '.github/workflows/full-program-data-audit.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Audit every nominee and data lane
        run: python scripts/audit_full_program_data.py
      - name: Commit canonical audit ledger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/intelligence/2026-09-15-full-program-data-audit.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record full 101-horse data audit"
          git pull --rebase origin main
          git push origin main
