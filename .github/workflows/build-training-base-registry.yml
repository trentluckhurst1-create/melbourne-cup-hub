name: build complete training base registry
on:
  push:
    branches: [main]
    paths:
      - 'data/training-bases/**'
      - 'data/trainers/**'
      - 'data/nominations/**'
      - 'scripts/build_training_base_registry.py'
      - '.github/workflows/build-training-base-registry.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/build_training_base_registry.py
      - name: Commit registry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/training-bases/2026-09-15-complete-registry.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Build complete 101-horse training base registry"
          git pull --rebase origin main
          git push origin main
